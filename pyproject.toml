[project]
name = "ts2vec"
version = "0.1.0"
description = "Automation framework for ML experiments in FLASH project"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "Zhihan Yue" },  { name = "Abian Hernandez" }]
requires-python = ">=3.12"

dependencies = [
    "bottleneck>=1.3.2",
    "torch>=1.8.1",
    "scipy>=1.6.1",
    "numpy>=1.19.2",
    "statsmodels>=0.12.2",
    "pandas>=1.0.1",
    "scikit-learn>=0.24.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.12",
]

[tool.setuptools]
py-modules = ["train", "ts2vec", "utils", "datautils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "tasks*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N806"]
